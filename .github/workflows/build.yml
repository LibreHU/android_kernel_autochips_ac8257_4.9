name: Build AC8257 kernel 4.19 (experimental)

# Experimental branch experimental-4.19.<N>: Linux 4.19.325 (ACK android-4.19-stable) with the AutoChips AC8257 vendor
# tree and the LibreHU changes (docs/K419.md). Builds Image.gz-dtb and the connectivity modules with Ubuntu clang 14
# and binutils (the AOSP clang 6.0.2 of the 4.9 branches is too old for the 4.19 core), then packs them into the
# stock UJC201 boot image layout as the 4.9 CI does:
#  - boot_ac8257.img: 10 MiB, boot vbmeta (normal boot partition)
#  - boot_ac8257_bootmenu.img: the same kernel behind the boot menu (TWRP / Android / Fastboot)
#  - recovery_test_ac8257.img: 32 MiB, recovery vbmeta, for the recovery test method (fastboot flash recovery +
#    fastboot oem reboot-recovery): a crash ends in a normal boot of the installed kernel, not a boot loop
# Published as a prerelease latest-<branch> marked experimental. LibreHU-flashablesZips only takes the branches it
# declares (stable-4.9.337): nothing from here reaches LibreHU Apps.

on:
  push:
    branches: ['experimental-4.19.*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      cmdline_append:
        description: 'Appended to the recovery test image command line'
        required: false
        default: 'init=/init log_buf_len=8M'

env:
  DEFCONFIG: ac8257_ujc201_defconfig
  # Variables of the AutoChips build environment (kenv.mk) read by Kconfig as $(VAR), values of the stock kernel
  ATC_MAKE: ATC_DISABLE_BATTERY_CHARGER=yes ATC_FASTDISP_VERSION=2.0
  # Toolchain: LLVM 14 (as the later android-4.19-stable kernels) with GNU binutils for the GNU assembler of 4.19
  KMAKE: ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-14 CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc python=python
  KBUILD_BUILD_USER: dokt
  KBUILD_BUILD_HOST: librehu

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref_name, 'experimental-4.19')
    # ubuntu-22.04: clang-14 and a python2 package (the AutoChips DTS generator tools/dct/DrvGen.py is Python 2)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Host packages and toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev cpio python2 \
            clang-14 lld-14 llvm-14 binutils-aarch64-linux-gnu
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version
          clang-14 --version | head -1
          aarch64-linux-gnu-ld --version | head -1

      - name: Configure
        run: make O=out $KMAKE $ATC_MAKE "$DEFCONFIG"

      - name: Build Image.gz-dtb and modules
        run: |
          set -o pipefail
          # One make for the image and the modules (the KernelSU connectivity module compares /proc/version with the
          # banner of this vmlinux: a second make would relink vmlinux with another build number)
          TARGETS=Image.gz-dtb
          grep -q '^CONFIG_LIBREHU_CONN_MODULES=y' out/.config && TARGETS="$TARGETS modules"
          make O=out $KMAKE $ATC_MAKE -j"$(nproc)" $TARGETS 2>&1 | tee build.log

      - name: Pack images
        env:
          CMDLINE_APPEND: ${{ github.event.inputs.cmdline_append || 'init=/init log_buf_len=8M initcall_debug ignore_loglevel' }}
        run: |
          mkdir -p dist
          K=out/arch/arm64/boot/Image.gz-dtb
          T=tools/ac8257/stock/boot_template_250718.img
          python3 tools/ac8257/repack_boot.py "$T" "$K" dist/recovery_test_ac8257.img \
            --vbmeta tools/ac8257/stock/recovery_stock_vbmeta_250718.bin --size 33554432 \
            --cmdline-append "$CMDLINE_APPEND"
          python3 tools/ac8257/repack_boot.py "$T" "$K" dist/boot_ac8257.img --size 10485760
          python3 tools/ac8257/bootmenu_image.py out/arch/arm64/boot/Image out/arch/arm64/boot/dts/mediatek/ac8257_ujc201.dtb \
            "$T" dist/boot_ac8257_bootmenu.img
          cp "$K" dist/
          cp out/.config dist/config
          if grep -q '^CONFIG_LIBREHU_CONN_MODULES=y' out/.config; then
            # binutils of the GNU toolchain here (the script defaults to the Android GCC 4.9 one of the 4.9 CI)
            STRIP=aarch64-linux-gnu-strip sh tools/stable/conn_ksu_module.sh out dist/librehu_connectivity_ksu.zip "${GITHUB_REF_NAME} r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::9}"
            # The same modules as TWRP zips (kernel + modules, modules only), as the kernel-stable / conn-modules-stable
            # zips of LibreHU-flashablesZips (tools/twrp)
            python3 tools/twrp/make_twrp_zips.py dist "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME} r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::9}"
          fi
          {
            echo "commit ${GITHUB_SHA}"
            echo "branch ${GITHUB_REF_NAME}"
            echo "kernel $(make -s O=out $KMAKE kernelversion 2>/dev/null)"
            echo "compiler $(clang-14 --version | head -1)"
            echo "recovery cmdline append: $CMDLINE_APPEND"
          } > dist/BUILD_INFO.txt
          sha256sum dist/* | tee -a dist/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ac8257-kernel-4.19-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Prerelease of the branch (latest-<branch>, experimental)
        if: github.event_name == 'push' || github.event.inputs.cmdline_append == 'init=/init log_buf_len=8M'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="latest-$BRANCH"
          NAME="r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::9}"
          printf 'version=%s\nbranch=%s\ncommit=%s\nrun=%s\ndate=%s\n' "$NAME" "$BRANCH" "$GITHUB_SHA" \
            "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/release.txt
          {
            echo "**EXPERIMENTAL** : noyau Linux 4.19.325 pour l'UJC201, branche \`$BRANCH\`, build $GITHUB_RUN_NUMBER (commit ${GITHUB_SHA::9})."
            echo "Pas encore valide sur l'unite. Lire docs/K419.md avant tout essai (methode recovery conseillee : le noyau"
            echo "installe dans boot ne change pas et un echec redemarre normalement)."
            echo
            echo "- \`recovery_test_ac8257.img\` : essai sans risque depuis la partition recovery (fastboot flash recovery, puis fastboot oem reboot-recovery)"
            echo "- \`boot_ac8257.img\` / \`boot_ac8257_bootmenu.img\` : partition boot (seulement apres un essai recovery reussi)"
            echo "- \`librehu_connectivity_ksu.zip\` : modules Wi-Fi / BT / GPS / FM de CE noyau (module KernelSU ; ouvrir une fois l'appli KernelSU Next avant, elle installe ksud)"
            echo "- \`librehu_kernel_twrp.zip\` : zip TWRP, ce noyau (menu de demarrage) dans boot + ses modules dans /vendor/lib/modules (seulement apres un essai recovery reussi ; sauvegardes dans /sdcard/LibreHU/backup)"
            echo "- \`librehu_conn_modules_twrp.zip\` : zip TWRP, modules seuls, quand boot contient deja ce noyau (retour aux modules d'origine : zip conn-modules-stable-restore de LibreHU-flashablesZips)"
            echo
            echo "Retour arriere : TWRP garde son propre noyau ; reflasher le boot de \`stable-4.9.337\` (release latest-stable-4.9.337)."
            echo "vbmeta n'est jamais touche."
          } > notes.md
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Noyau 4.19 EXPERIMENTAL $NAME" --notes-file notes.md --prerelease=true
          else
            gh release create "$TAG" --title "Noyau 4.19 EXPERIMENTAL $NAME" --notes-file notes.md --prerelease=true --verify-tag
          fi
          gh release upload "$TAG" dist/boot_ac8257.img dist/boot_ac8257_bootmenu.img dist/recovery_test_ac8257.img \
            dist/Image.gz-dtb dist/config dist/BUILD_INFO.txt dist/release.txt --clobber
          [ -f dist/librehu_connectivity_ksu.zip ] && gh release upload "$TAG" dist/librehu_connectivity_ksu.zip --clobber || true
          [ -f dist/librehu_kernel_twrp.zip ] && gh release upload "$TAG" dist/librehu_kernel_twrp.zip dist/librehu_conn_modules_twrp.zip --clobber || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7
