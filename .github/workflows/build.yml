name: Build AC8257 kernel 4.19 (experimental)

# Experimental branch experimental-4.19.<N>: Linux 4.19.325 (ACK android-4.19-stable) with the AutoChips AC8257 vendor
# tree and the LibreHU changes (docs/K419.md). Builds Image.gz-dtb and the connectivity modules with Ubuntu clang 14
# and binutils (the AOSP clang 6.0.2 of the 4.9 branches is too old for the 4.19 core), then packs them into the
# stock UJC201 boot image layout as the 4.9 CI does:
#  - boot_ac8257_<v>.img: 10 MiB, boot vbmeta (normal boot partition)
#  - boot_ac8257_bootmenu_<v>.img: the same kernel behind the boot menu (TWRP / Android / Fastboot)
#  - recovery_test_ac8257_<v>.img: 32 MiB, recovery vbmeta, for the recovery test method (fastboot flash recovery +
#    fastboot oem reboot-recovery): a crash ends in a normal boot of the installed kernel, not a boot loop
# for two variants <v>: a9 (Android 9) and a10 (Android 10 and later), see the build job. Two more builds, a9-lto32
# and a10-lto32 (arch/arm64/configs/ac8257_lto32.config): ThinLTO, everything built in (connectivity included, no
# module), 32 MiB images for a boot partition grown by librehu_boot32_twrp.zip (job boot32: that zip, its return zip
# librehu_boot32_restore_twrp.zip and their tests).
# Published as a prerelease latest-<branch> marked experimental. LibreHU-flashablesZips only takes the branches it
# declares (stable-4.9.337): nothing from here reaches LibreHU Apps.

on:
  push:
    branches: ['experimental-4.19.*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      cmdline_append:
        description: 'Appended to the recovery test image command line'
        required: false
        default: 'init=/init log_buf_len=8M'

env:
  DEFCONFIG: ac8257_ujc201_defconfig
  # Variables of the AutoChips build environment (kenv.mk) read by Kconfig as $(VAR), values of the stock kernel
  ATC_MAKE: ATC_DISABLE_BATTERY_CHARGER=yes ATC_FASTDISP_VERSION=2.0
  # Toolchain: LLVM 14 (as the later android-4.19-stable kernels) with GNU binutils for the GNU assembler of 4.19
  KMAKE: ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-14 CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC=gcc python=python
  KBUILD_BUILD_USER: dokt
  KBUILD_BUILD_HOST: librehu

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref_name, 'experimental-4.19')
    # Two builds of the same tree (arch/arm64/configs/ac8257_<variant>.config over the defconfig):
    #  - a9: Android 9 (LineageOS 16.0, stock ROM): xt_qtaguid (Android 9 enables bandwidth control only with
    #    /proc/net/xt_qtaguid/ctrl, else NetworkPolicy waits 30 s at boot), uname -r 4.19.325-a9
    #  - a10: Android 10 and later (LineageOS 17.1...): no xt_qtaguid, as the Android common kernels, 4.19.325-a10
    # Each variant has its own images and modules (the modules match only the kernel of the same build).
    # a9-lto32 / a10-lto32: the same tree with ac8257_lto32.config on top (ThinLTO with ld.lld, everything built in),
    # images of 32 MiB for the boot partition of librehu_boot32_twrp.zip, uname -r 4.19.325-a9-lto32 / -a10-lto32
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: a9
            android: a9
          - variant: a10
            android: a10
          - variant: a9-lto32
            android: a9
            lto32: true
          - variant: a10-lto32
            android: a10
            lto32: true
    # ubuntu-22.04: clang-14 and a python2 package (the AutoChips DTS generator tools/dct/DrvGen.py is Python 2)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      V: ${{ matrix.variant }}
      A: ${{ matrix.android }}
      # ThinLTO needs ld.lld (LD_IS_LLD at configuration time), llvm-ar and llvm-nm for the LTO objects; the top
      # Makefile also calls LLVM_AR / LLVM_NM, "llvm-ar" / "llvm-nm" without version, absent from the runner (r182)
      LTO_MAKE: ${{ matrix.lto32 && 'LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 LLVM_AR=llvm-ar-14 LLVM_NM=llvm-nm-14' || '' }}
      BOOT_SIZE: ${{ matrix.lto32 && '33554432' || '10485760' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Host packages and toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev cpio python2 \
            clang-14 lld-14 llvm-14 binutils-aarch64-linux-gnu
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version
          clang-14 --version | head -1
          aarch64-linux-gnu-ld --version | head -1

      - name: Configure (${{ matrix.variant }})
        run: |
          make O=out $KMAKE $LTO_MAKE $ATC_MAKE "$DEFCONFIG"
          make O=out $KMAKE $LTO_MAKE $ATC_MAKE "ac8257_${A}.config"
          if [ -n "$LTO_MAKE" ]; then
            make O=out $KMAKE $LTO_MAKE $ATC_MAKE ac8257_lto32.config
            ./scripts/config --file out/.config --set-str LOCALVERSION "-${V}"
            make O=out $KMAKE $LTO_MAKE $ATC_MAKE olddefconfig
            grep -q '^CONFIG_LTO_CLANG=y' out/.config && grep -q '^CONFIG_MTK_COMBO_DRV_BUILD_IN=y' out/.config \
              || { echo "::error::ThinLTO or built-in connectivity missing from the lto32 configuration"; exit 1; }
            ! grep -q '=m$' out/.config || { echo "::error::modules left in the lto32 configuration"; grep '=m$' out/.config; exit 1; }
          fi
          grep -E '^CONFIG_LOCALVERSION=|XT_MATCH_OWNER|XT_MATCH_QTAGUID|^CONFIG_LTO_CLANG|^CONFIG_MTK_COMBO_DRV_BUILD_IN' out/.config

      - name: Build Image.gz-dtb and modules
        run: |
          set -o pipefail
          # One make for the image and the modules (the KernelSU connectivity module compares /proc/version with the
          # banner of this vmlinux: a second make would relink vmlinux with another build number)
          TARGETS=Image.gz-dtb
          grep -q '^CONFIG_LIBREHU_CONN_MODULES=y' out/.config && TARGETS="$TARGETS modules"
          make O=out $KMAKE $LTO_MAKE $ATC_MAKE -j"$(nproc)" $TARGETS 2>&1 | tee build.log

      - name: Pack images
        env:
          CMDLINE_APPEND: ${{ github.event.inputs.cmdline_append || 'init=/init log_buf_len=8M initcall_debug ignore_loglevel' }}
        run: |
          mkdir -p dist
          # All images: no kernel page table isolation. KPTI was only forced on by KASLR ("forced ON by KASLR"):
          # the Cortex-A53 is not affected by Meltdown (kpti_safe_list) and KPTI costs every system call, interrupt
          # and page fault from userspace. The LK passes no kpti= of its own.
          KERNEL_APPEND="kpti=0"
          K=out/arch/arm64/boot/Image.gz-dtb
          T=tools/ac8257/stock/boot_template_250718.img
          python3 tools/ac8257/repack_boot.py "$T" "$K" dist/recovery_test_ac8257_${V}.img \
            --vbmeta tools/ac8257/stock/recovery_stock_vbmeta_250718.bin --size 33554432 \
            --cmdline-append "$CMDLINE_APPEND $KERNEL_APPEND"
          # Boot partition images: Android in SELinux permissive, as the stock ROM and the LineageOS 16.0 boot images
          # (tools/fetch_kernel.sh of the device tree): the stock vendor policy never ran enforcing, and the LK adds
          # androidboot.selinux=permissive only in a recovery-partition boot (MCU ttyS1, battery, FM, MFi, GPU denied)
          BOOT_APPEND="androidboot.selinux=permissive $KERNEL_APPEND"
          # 10 MiB (stock boot partition), or 32 MiB for the lto32 builds (boot grown by librehu_boot32_twrp.zip)
          python3 tools/ac8257/repack_boot.py "$T" "$K" dist/boot_ac8257_${V}.img --size $BOOT_SIZE --cmdline-append "$BOOT_APPEND"
          python3 tools/ac8257/bootmenu_image.py out/arch/arm64/boot/Image out/arch/arm64/boot/dts/mediatek/ac8257_ujc201.dtb \
            "$T" dist/boot_ac8257_bootmenu_${V}.img --size $BOOT_SIZE --cmdline-append "$BOOT_APPEND"
          cp "$K" dist/Image.gz-dtb_${V}
          cp out/.config dist/config_${V}
          if grep -q '^CONFIG_LIBREHU_CONN_MODULES=y' out/.config; then
            # binutils of the GNU toolchain here (the script defaults to the Android GCC 4.9 one of the 4.9 CI)
            STRIP=aarch64-linux-gnu-strip sh tools/stable/conn_ksu_module.sh out dist/librehu_connectivity_ksu_${V}.zip \
              "${GITHUB_REF_NAME} r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::9} ${V}"
            # The same modules as TWRP zips (kernel + modules, modules only), as the kernel-stable / conn-modules-stable
            # zips of LibreHU-flashablesZips (tools/twrp); they check the Android version of /system against ${V}
            python3 tools/twrp/make_twrp_zips.py dist "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME} r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::9} ${V}" "${V}"
          elif [ -n "$LTO_MAKE" ]; then
            # Kernel only (nothing to install in /vendor), refused by the zip on a 10 MiB boot partition
            python3 tools/twrp/make_twrp_zips.py dist "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME} r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::9} ${V}" "${V}"
          fi
          {
            echo "commit ${GITHUB_SHA}"
            echo "branch ${GITHUB_REF_NAME}"
            echo "variant ${V}"
            echo "kernel $(make -s O=out $KMAKE kernelrelease 2>/dev/null)"
            echo "compiler $(clang-14 --version | head -1)"
            echo "recovery cmdline append: $CMDLINE_APPEND $KERNEL_APPEND"
            echo "boot cmdline append: $BOOT_APPEND"
          } > dist/BUILD_INFO_${V}.txt
          sha256sum dist/* | tee -a dist/BUILD_INFO_${V}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ac8257-kernel-4.19-${{ matrix.variant }}-${{ github.sha }}
          path: dist/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ matrix.variant }}-${{ github.sha }}
          path: build.log
          retention-days: 7

  boot32:
    # TWRP zips librehu_boot32_twrp.zip (boot partition 10 -> 32 MiB) and librehu_boot32_restore_twrp.zip (return),
    # with tools/twrp/boot32/gpt32.c built for arm64 (static, no libc). Tests: gpt32 on a synthetic GPT, built for
    # the runner and for arm64 under qemu-user; the two zips on a synthetic eMMC image with power cuts.
    if: startsWith(github.ref_name, 'experimental-4.19')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-14 lld-14 qemu-user-static e2fsprogs zip unzip mksh

      - name: Build and test gpt32
        run: |
          mkdir -p out dist
          gcc -DHOSTED -O2 -Wall -Wextra -Werror -o out/gpt32-host tools/twrp/boot32/gpt32.c
          clang-14 --target=aarch64-linux-gnu -Os -Wall -Werror -ffreestanding -fno-builtin -fno-stack-protector \
            -nostdlib -static -fuse-ld=lld -Wl,--gc-sections -Wl,--build-id=none -o out/gpt32 tools/twrp/boot32/gpt32.c
          file out/gpt32
          python3 tools/twrp/boot32/test_gpt32.py out/gpt32-host
          python3 tools/twrp/boot32/test_gpt32.py out/gpt32 qemu-aarch64-static

      - name: Zips and their test
        run: |
          python3 tools/twrp/make_twrp_zips.py boot32 dist "${GITHUB_REF_NAME} r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::9}" out/gpt32
          python3 tools/twrp/boot32/test_boot32_zips.py dist out/gpt32-host
          sha256sum dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: ac8257-kernel-4.19-boot32-${{ github.sha }}
          path: dist/
          retention-days: 30

  release:
    # One job publishes all the variants (two jobs editing the same release at once would race)
    needs: [build, boot32]
    if: github.event_name == 'push' || github.event.inputs.cmdline_append == 'init=/init log_buf_len=8M'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: ac8257-kernel-4.19-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Prerelease of the branch (latest-<branch>, experimental)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ls -l dist
          TAG="latest-$BRANCH"
          NAME="r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::9}"
          printf 'version=%s\nbranch=%s\ncommit=%s\nrun=%s\ndate=%s\nvariants=a9 a10 a9-lto32 a10-lto32\n' "$NAME" "$BRANCH" "$GITHUB_SHA" \
            "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/release.txt
          {
            echo "**EXPERIMENTAL** : noyau Linux 4.19.325 pour l'UJC201, branche \`$BRANCH\`, build $GITHUB_RUN_NUMBER (commit ${GITHUB_SHA::9})."
            echo "Lire docs/K419.md avant tout essai."
            echo
            echo "**Deux variantes, a prendre selon la version d'Android** (les modules ne marchent qu'avec le noyau de la meme variante) :"
            echo "- \`_a9\` : Android 9 (LineageOS 16.0, ROM stock) ; noyau 4.19.325-a9 (xt_qtaguid, sans lui Android 9 attend 30 s au demarrage)"
            echo "- \`_a10\` : Android 10 et plus (LineageOS 17.1...) ; noyau 4.19.325-a10"
            echo
            echo "Fichiers (remplacer \`<v>\` par a9 ou a10) :"
            echo "- \`recovery_test_ac8257_<v>.img\` : essai sans risque depuis la partition recovery (fastboot flash recovery, puis fastboot oem reboot-recovery)"
            echo "- \`boot_ac8257_<v>.img\` / \`boot_ac8257_bootmenu_<v>.img\` : partition boot (SELinux permissif, comme le stock)"
            echo "- \`librehu_kernel_twrp_<v>.zip\` : zip TWRP, ce noyau (menu de demarrage) dans boot + ses modules dans /vendor/lib/modules ; refuse si la version d'Android ne correspond pas (sauvegardes dans /sdcard/LibreHU/backup)"
            echo "- \`librehu_conn_modules_twrp_<v>.zip\` : zip TWRP, modules seuls, quand boot contient deja ce noyau"
            echo "- \`librehu_connectivity_ksu_<v>.zip\` : les memes modules en module KernelSU"
            echo
            echo "**Noyau ThinLTO, tout integre (variantes \`a9-lto32\` / \`a10-lto32\`), pour une partition boot de 32 Mio** :"
            echo "- \`recovery_test_ac8257_<v>-lto32.img\` : essai sans risque depuis la partition recovery (32 Mio, aucune migration necessaire)"
            echo "- \`librehu_boot32_twrp.zip\` : agrandit boot de 10 a 32 Mio (dtbo 1 Mio, tee1 / tee2 deplaces, vendor 2033 Mio) ; exige vbmeta en VERIFICATION_DISABLED, 4,4 Go libres, une sauvegarde SP Flash Tool complete ; sauvegardes dans /sdcard/LibreHU/boot32"
            echo "- \`librehu_boot32_restore_twrp.zip\` : retour a la table d'origine (boot 10 Mio) ; flasher d'abord un noyau 10 Mio"
            echo "- \`librehu_kernel32_twrp_<v>.zip\` : ce noyau (menu de demarrage) dans la partition boot de 32 Mio ; Wi-Fi / BT / GPS / FM integres, aucun module a installer ; refuse sur une partition de 10 Mio"
            echo "- \`boot_ac8257_<v>-lto32.img\` / \`boot_ac8257_bootmenu_<v>-lto32.img\` : images de 32 Mio"
            echo "Apres la migration, n'ecrire une image boot de 10 Mio que par les zips TWRP de cette release (pied AVB recopie en fin de partition)."
            echo
            echo "Retour arriere : TWRP garde son propre noyau ; reflasher le boot de \`stable-4.9.337\` (release latest-stable-4.9.337)."
            echo "vbmeta n'est jamais touche."
          } > notes.md
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Noyau 4.19 EXPERIMENTAL $NAME" --notes-file notes.md --prerelease=true
            # Files of the single-variant builds (before a9 / a10): removed so that nobody takes a stale kernel
            for old in boot_ac8257.img boot_ac8257_bootmenu.img recovery_test_ac8257.img Image.gz-dtb config BUILD_INFO.txt \
                       librehu_connectivity_ksu.zip librehu_kernel_twrp.zip librehu_conn_modules_twrp.zip; do
              gh release delete-asset "$TAG" "$old" -y 2>/dev/null || true
            done
          else
            gh release create "$TAG" --title "Noyau 4.19 EXPERIMENTAL $NAME" --notes-file notes.md --prerelease=true --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
