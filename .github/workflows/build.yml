name: Build AC8257 kernel

# Builds Image.gz-dtb with the AOSP GCC 4.9 toolchain and packs it into the
# stock UJC201 boot image layout (tools/ac8257/stock/boot_template_250718.img:
# stock header, cmdline and boot vbmeta, without the stock kernel):
#  - recovery_test_ac8257.img: 32 MiB, recovery vbmeta, for the recovery test
#    method of docs/BUILD.md (fastboot flash recovery + fastboot oem reboot-recovery)
#  - boot_ac8257.img: 10 MiB, boot vbmeta (normal boot partition)
# Branch LibreHU-main: AutoChips GPL kernel (autochips-gpl) + the LibreHU changes ported from reverse-engineering.
# Branch connectivity-builtin: LibreHU-main + Wi-Fi / BT / GPS / FM drivers built in (docs/CONNECTIVITY.md).

on:
  push:
    branches: [LibreHU-main, connectivity-builtin]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      cmdline_append:
        description: 'Appended to the recovery test image command line'
        required: false
        default: 'init=/init log_buf_len=8M'

env:
  # LineageOS mirror of AOSP prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 (GCC 4.9.x 20150123)
  TOOLCHAIN_REPO: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
  TOOLCHAIN_SHA: a61b4b9ea2a5098dbf113999526978aec683753b
  # AutoChips ac8257_demo_defconfig with the product settings of the stock UJC201 kernel (#72)
  DEFCONFIG: ac8257_ujc201_defconfig
  # Variables of the AutoChips build environment (kenv.mk) read by Kconfig (option env=), values of the stock kernel
  ATC_MAKE: ATC_DISABLE_BATTERY_CHARGER=yes ATC_FASTDISP_VERSION=2.0
  # HOSTCC with -fcommon: the AutoChips scripts/dtc defines yylloc twice, which host GCC >= 10 refuses at link time
  # (fixed upstream by "scripts/dtc: Remove redundant YYLOC global declaration", present on reverse-engineering)
  # Author shown by /proc/version and the boot log: "Linux version ... (dokt@librehu)" instead of the CI runner's
  KBUILD_BUILD_USER: dokt
  KBUILD_BUILD_HOST: librehu

# Release latest-<branch> of each build pushed (boot images), picked up by LibreHU-flashablesZips (TWRP zips,
# LibreHU Apps).
permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04: last runner image with a python2 package (the AutoChips DTS generator needs it)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev cpio
          # tools/dct/DrvGen.py (AutoChips cust.dtsi generator) is Python 2, run through #! /usr/bin/python
          sudo apt-get install -y --no-install-recommends python2
          # AOSP clang-4691093 is linked against libtinfo.so.5
          sudo apt-get install -y --no-install-recommends libtinfo5
          # connectivity-builtin: zopfli recompression of the kernel (pigz -11)
          sudo apt-get install -y --no-install-recommends pigz
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          /usr/bin/python --version

      - name: Toolchain (AOSP GCC 4.9)
        run: |
          git init -q "$RUNNER_TEMP/gcc49"
          cd "$RUNNER_TEMP/gcc49"
          git remote add origin "$TOOLCHAIN_REPO"
          git fetch -q --depth 1 origin "$TOOLCHAIN_SHA"
          git checkout -q FETCH_HEAD
          echo "$RUNNER_TEMP/gcc49/bin" >> "$GITHUB_PATH"

      - name: Toolchain (AOSP clang 6.0.2, clang-4691093, as the stock kernel)
        run: |
          # The stock UJC201 kernel #72 was built with AOSP clang 6.0.2 (r316199, clang-4691093) and the GCC 4.9
          # binutils: same compiler here, so the AutoChips sources build as they did for Jancar (GCC 4.9 stops on
          # warnings clang does not give) and the symbol CRCs can match the stock vendor modules.
          mkdir -p "$RUNNER_TEMP/clang"
          cd "$RUNNER_TEMP/clang"
          for ref in refs/tags/android-9.0.0_r61 refs/tags/android-9.0.0_r1 refs/heads/pie-release; do
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$ref/clang-4691093.tar.gz"
            if curl -fsSL --retry 3 "$url" -o clang.tar.gz && tar xzf clang.tar.gz; then echo "clang from $ref"; break; fi
          done
          ./bin/clang --version | tee /dev/stderr | grep -q 4691093
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC="gcc -fcommon" $ATC_MAKE "$DEFCONFIG"

      - name: Build Image.gz-dtb
        run: |
          set -o pipefail
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CC=clang CLANG_TRIPLE=aarch64-linux-gnu- HOSTCC="gcc -fcommon" $ATC_MAKE -j"$(nproc)" Image.gz-dtb 2>&1 | tee build.log

      - name: Pack images
        env:
          CMDLINE_APPEND: ${{ github.event.inputs.cmdline_append || 'init=/init log_buf_len=8M' }}
        run: |
          mkdir -p dist
          K=out/arch/arm64/boot/Image.gz-dtb
          # connectivity-builtin: the built-in Wi-Fi/BT/GPS/FM drivers make the kernel too big for the
          # 10 MiB boot partition with gzip -9: same Image recompressed with zopfli (pigz -11), still a
          # standard gzip stream for the LK, DTB appended as the kernel build does (docs/CONNECTIVITY.md)
          echo "Image.gz-dtb (gzip -9): $(stat -c %s "$K") bytes"
          pigz -11 -n -c out/arch/arm64/boot/Image > out/Image.zopfli.gz
          gzip -t out/Image.zopfli.gz
          cat out/Image.zopfli.gz out/arch/arm64/boot/dts/mediatek/ac8257_ujc201.dtb > out/Image.gz-dtb
          K=out/Image.gz-dtb
          echo "Image.gz-dtb (zopfli): $(stat -c %s "$K") bytes"
          T=tools/ac8257/stock/boot_template_250718.img
          python3 tools/ac8257/repack_boot.py "$T" "$K" dist/recovery_test_ac8257.img \
            --vbmeta tools/ac8257/stock/recovery_stock_vbmeta_250718.bin --size 33554432 \
            --cmdline-append "$CMDLINE_APPEND"
          python3 tools/ac8257/repack_boot.py "$T" "$K" dist/boot_ac8257.img --size 10485760
          # Same kernel behind the boot menu (TWRP / Android / Fastboot at each start): tools/ac8257/bootmenu_image.py
          python3 tools/ac8257/bootmenu_image.py out/arch/arm64/boot/Image out/arch/arm64/boot/dts/mediatek/ac8257_ujc201.dtb \
            "$T" dist/boot_ac8257_bootmenu.img --zopfli
          cp "$K" dist/
          cp out/.config dist/config
          echo "commit ${GITHUB_SHA}" > dist/BUILD_INFO.txt
          echo "recovery cmdline append: $CMDLINE_APPEND" >> dist/BUILD_INFO.txt
          sha256sum dist/* | tee -a dist/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ac8257-kernel-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Release of the branch (latest-<branch>)
        # Pushes, and manual runs with the default command line (a custom one stays an artifact)
        if: github.event_name == 'push' || github.event.inputs.cmdline_append == 'init=/init log_buf_len=8M'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # One release per branch, tag latest-<branch>, replaced at each build: LibreHU-flashablesZips makes the TWRP
          # zips of LibreHU Apps from its boot images and reads the version in release.txt. Only LibreHU-main is a
          # full release; the other branches (connectivity-builtin...) are prereleases.
          TAG="latest-$BRANCH"
          NAME="r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::9}"
          PRE=true; [ "$BRANCH" = LibreHU-main ] && PRE=false
          printf 'version=%s\nbranch=%s\ncommit=%s\nrun=%s\ndate=%s\n' "$NAME" "$BRANCH" "$GITHUB_SHA" \
            "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/release.txt
          {
            echo "Noyau LibreHU de la branche \`$BRANCH\`, build $GITHUB_RUN_NUMBER (commit ${GITHUB_SHA::9}) : $(git log -1 --pretty=%s)"
            echo
            echo "- \`boot_ac8257.img\` : partition boot (10 Mio, AVB du boot stock)"
            echo "- \`boot_ac8257_bootmenu.img\` : le meme noyau derriere le menu de demarrage (TWRP / Android / Fastboot)"
            echo "- \`recovery_test_ac8257.img\` : methode de test depuis la partition recovery (docs/BUILD.md)"
            echo
            echo "Zips TWRP et ecriture depuis Android : LibreHU Apps, onglet Zips (categorie Noyau), ou"
            echo "\`fastboot flash boot boot_ac8257.img\`. vbmeta n'est pas touche."
          } > notes.md
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Noyau $BRANCH $NAME" --notes-file notes.md --prerelease=$PRE
          else
            gh release create "$TAG" --title "Noyau $BRANCH $NAME" --notes-file notes.md --prerelease=$PRE --verify-tag
          fi
          gh release upload "$TAG" dist/boot_ac8257.img dist/boot_ac8257_bootmenu.img dist/recovery_test_ac8257.img \
            dist/Image.gz-dtb dist/config dist/BUILD_INFO.txt dist/release.txt --clobber

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7
